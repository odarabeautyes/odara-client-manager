<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8d7668"><link rel="manifest" href="manifest.json"><title>ODÁRA Beauty Essentials</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--a:#8d7668;--bg:#f8f5f1;--line:#e8dfd8;--mut:#81756e;--ink:#302a27}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#f7f0eb,#eee7e0)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 60px #0001}.login .card{width:min(420px,100%)}.logo{text-align:center;font-size:30px;font-weight:800;letter-spacing:2px}.sub,.muted{color:var(--mut);font-size:13px}.sub{text-align:center;margin:5px 0 22px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.primary{border:0;background:var(--a);color:#fff;border-radius:11px;padding:11px 14px;font-weight:700}.wide{width:100%;margin-top:16px}.msg{text-align:center;min-height:20px;margin-top:10px;font-size:13px}.hidden{display:none!important}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:13px 17px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:1px}.logout,.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.tabs{display:flex;gap:7px;overflow:auto;background:#fff;border-bottom:1px solid var(--line);padding:11px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.tab.active{background:var(--a);color:#fff;border-color:var(--a)}main{max-width:1100px;margin:auto;padding:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:24px;margin-top:4px}.list{display:grid;gap:10px}.row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.rowtop{display:flex;justify-content:space-between;gap:10px}.pill{background:#eee6df;border-radius:999px;padding:4px 8px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.danger{color:#a84e4e}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:14px;z-index:20}.modalbox{width:min(600px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.mhead{display:flex;justify-content:space-between}.x{border:0;background:transparent;font-size:24px}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}.user{display:none}}
</style></head><body>
<div id="login" class="login"><div class="card"><div class="logo">ODÁRA</div><div class="sub">Beauty Essentials · Client Manager</div><label>Correo</label><input id="email" class="field" type="email"><label>Contraseña</label><input id="password" class="field" type="password"><button id="loginBtn" class="primary wide">Entrar</button><div id="msg" class="msg"></div></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand">ODÁRA</div><div><span id="user" class="muted user"></span> <button id="logout" class="logout">Salir</button></div></header><nav class="tabs"><button class="tab active" data-v="home">Inicio</button><button class="tab" data-v="clients">Clientas</button><button class="tab" data-v="appts">Citas</button><button class="tab" data-v="payments">Pagos</button><button class="tab" data-v="inventory">Inventario</button><button class="tab" data-v="tirze">Tirze</button></nav><main>
<section id="home" class="view"><div class="panel"><h2>Hola ✨</h2><div class="muted">Tu información está conectada a la nube de ODÁRA.</div></div><div class="stats"><div class="stat"><span class="muted">Clientas</span><b id="sc">0</b></div><div class="stat"><span class="muted">Citas</span><b id="sa">0</b></div><div class="stat"><span class="muted">Saldo</span><b id="sb">$0.00</b></div></div></section>
<section id="clients" class="view hidden"><div class="panel"><button class="primary" onclick="clientForm()">+ Nueva clienta</button> <input id="search" class="field" style="max-width:400px;margin-top:8px" placeholder="Buscar nombre o teléfono"></div><div id="clientList" class="list"></div></section>
<section id="appts" class="view hidden"><div class="panel"><button class="primary" onclick="apptForm()">+ Nueva cita</button></div><div id="apptList" class="list"></div></section>
<section id="payments" class="view hidden"><div class="panel"><button class="primary" onclick="payForm()">+ Registrar pago</button></div><div id="payList" class="list"></div></section>
<section id="inventory" class="view hidden"><div class="panel"><button class="primary" onclick="invForm()">+ Producto</button></div><div id="invList" class="list"></div></section>
<section id="tirze" class="view hidden"><div class="panel"><button class="primary" onclick="tirzeForm()">+ Registro Tirze</button></div><div id="tirzeList" class="list"></div></section>
</main></div><div id="modal" class="modal hidden"><div class="modalbox"><div class="mhead"><h2 id="mt">Nuevo</h2><button class="x" onclick="closeM()">×</button></div><div id="mb"></div></div></div>
<script>
// Diagnóstico y limpieza de caché antigua
window.addEventListener('error',e=>{const m=document.getElementById('msg');if(m)m.textContent='Error de la aplicación: '+(e.message||'revisa la conexión');});
window.addEventListener('unhandledrejection',e=>{const m=document.getElementById('msg');if(m)m.textContent='Error de conexión: '+(e.reason?.message||e.reason||'intenta de nuevo');});
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
const URL="https://dterplmhtscjoeslweav.supabase.co",KEY="sb_publishable_GpwmY6Aj1C8A1wI0x4iBnw_2uYLD9uo";
const db=window.supabase ? window.supabase.createClient(URL,KEY) : null;
let D={c:[],a:[],p:[],i:[],t:[]};const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),money=x=>'$'+Number(x||0).toFixed(2),today=()=>new Date().toISOString().slice(0,10);function toast(x){$('msg').textContent=x;setTimeout(()=>{if($('msg'))$('msg').textContent=''},2500)}function closeM(){$('modal').classList.add('hidden')}function modal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.remove('hidden')}
async function load(){let [c,a,p,i,t]=await Promise.all([db.from('clients').select('*').order('created_at',{ascending:false}),db.from('appointments').select('*,clients(name)').order('appointment_date'),db.from('payments').select('*,clients(name)').order('payment_date',{ascending:false}),db.from('inventory').select('*').order('name'),db.from('tirze_records').select('*,clients(name)').order('created_at',{ascending:false})]);D={c:c.data||[],a:a.data||[],p:p.data||[],i:i.data||[],t:t.data||[]};render()}
function render(){ $('sc').textContent=D.c.length;$('sa').textContent=D.a.length;$('sb').textContent=money(D.c.reduce((n,x)=>n+Number(x.balance||0),0));let q=($('search').value||'').toLowerCase();$('clientList').innerHTML=D.c.filter(x=>(x.name+' '+(x.phone||'')).toLowerCase().includes(q)).map(x=>`<div class=row><div class=rowtop><div><b>${esc(x.name)}</b><div class=muted>${esc(x.phone||'')} · ${esc(x.service||'')}</div></div><span class=pill>${esc(x.status||'Activa')}</span></div><div>${x.next_date?'Próxima: '+esc(x.next_date):''} ${Number(x.balance||0)>0?` · <span class=danger>Debe ${money(x.balance)}</span>`:''}</div><div class=actions><button class=btn onclick="clientForm('${x.id}')">Editar</button><button class="btn danger" onclick="del('clients','${x.id}')">Eliminar</button></div></div>`).join('')||'<div class=panel>No hay clientas.</div>';$('apptList').innerHTML=D.a.map(x=>`<div class=row><b>${esc(x.clients?.name||'Clienta')}</b><div>${esc(x.appointment_date)} · ${esc(x.appointment_time||'')} · ${esc(x.service||'')}</div><div class=muted>${money(x.price)}</div><div class=actions><button class="btn danger" onclick="del('appointments','${x.id}')">Eliminar</button></div></div>`).join('')||'<div class=panel>No hay citas.</div>';$('payList').innerHTML=D.p.map(x=>`<div class=row><div class=rowtop><b>${esc(x.clients?.name||'Clienta')}</b><b>${money(x.amount)}</b></div><div>${esc(x.payment_date)} · ${esc(x.method||'')}</div><div class=muted>${esc(x.note||'')}</div><div class=actions><button class="btn danger" onclick="del('payments','${x.id}')">Eliminar</button></div></div>`).join('')||'<div class=panel>No hay pagos.</div>';$('invList').innerHTML=D.i.map(x=>`<div class=row><div class=rowtop><b>${esc(x.name)}</b><span>${Number(x.quantity)<=Number(x.minimum_quantity||0)?'⚠ Bajo':'● OK'}</span></div><div>${esc(x.category||'')} · Cantidad: <b>${x.quantity}</b> · Mínimo: ${x.minimum_quantity||0}</div><div class=muted>Costo: ${money(x.cost)}</div><div class=actions><button class=btn onclick="invForm('${x.id}')">Editar</button><button class="btn danger" onclick="del('inventory','${x.id}')">Eliminar</button></div></div>`).join('')||'<div class=panel>No hay productos.</div>';$('tirzeList').innerHTML=D.t.map(x=>`<div class=row><b>${esc(x.clients?.name||'Clienta')}</b><div class=muted>${esc((x.created_at||'').slice(0,10))}</div><div>${esc(x.notes||'')}</div><div class=actions><button class="btn danger" onclick="del('tirze_records','${x.id}')">Eliminar</button></div></div>`).join('')||'<div class=panel>No hay registros.</div>'}
const opts=s=>D.c.map(x=>`<option value="${x.id}" ${x.id===s?'selected':''}>${esc(x.name)}</option>`).join('');
function clientForm(id=''){let x=D.c.find(z=>z.id===id)||{};modal(id?'Editar clienta':'Nueva clienta',`<div class=grid><div><label>Nombre</label><input id=n class=field value="${esc(x.name)}"></div><div><label>Teléfono</label><input id=ph class=field value="${esc(x.phone)}"></div><div><label>Servicio</label><select id=sv class=field><option>Tirze</option><option>Pestañas</option><option>Faciales</option><option>Brows</option><option>Otros</option></select></div><div><label>Estado</label><select id=st class=field><option>Activa</option><option>Inactiva</option></select></div><div><label>Última fecha</label><input id=ld class=field type=date value="${x.last_date||''}"></div><div><label>Próxima fecha</label><input id=nd class=field type=date value="${x.next_date||''}"></div><div><label>Precio</label><input id=pr class=field type=number step=.01 value="${x.price||0}"></div><div><label>Saldo</label><input id=bal class=field type=number step=.01 value="${x.balance||0}"></div></div><label>Notas</label><textarea id=no class=field rows=4>${esc(x.notes)}</textarea><button class="primary wide" onclick="saveClient('${id}')">Guardar</button>`);if(x.service)$('sv').value=x.service;if(x.status)$('st').value=x.status}
async function saveClient(id){let r={name:$('n').value.trim(),phone:$('ph').value.trim(),service:$('sv').value,status:$('st').value,last_date:$('ld').value||null,next_date:$('nd').value||null,price:+$('pr').value||0,balance:+$('bal').value||0,notes:$('no').value.trim()};if(!r.name)return toast('Escribe el nombre');let z=id?await db.from('clients').update(r).eq('id',id):await db.from('clients').insert(r);if(z.error)return toast(z.error.message);closeM();await load()}
function apptForm(){modal('Nueva cita',`<label>Clienta</label><select id=ac class=field>${opts()}</select><div class=grid><div><label>Fecha</label><input id=ad class=field type=date value="${today()}"></div><div><label>Hora</label><input id=at class=field type=time></div></div><label>Servicio</label><input id=as class=field><label>Precio</label><input id=ap class=field type=number step=.01><label>Notas</label><textarea id=an class=field></textarea><button class="primary wide" onclick="saveAppt()">Guardar</button>`)}async function saveAppt(){let z=await db.from('appointments').insert({client_id:$('ac').value,appointment_date:$('ad').value,appointment_time:$('at').value,service:$('as').value,price:+$('ap').value||0,notes:$('an').value});if(z.error)return toast(z.error.message);closeM();await load()}
function payForm(){modal('Registrar pago',`<label>Clienta</label><select id=pc class=field>${opts()}</select><label>Fecha</label><input id=pd class=field type=date value="${today()}"><label>Monto</label><input id=pa class=field type=number step=.01><label>Método</label><select id=pm class=field><option>Cash</option><option>Zelle</option><option>CashApp</option><option>Tarjeta</option><option>Transferencia</option></select><label>Nota</label><textarea id=pn class=field></textarea><button class="primary wide" onclick="savePay()">Guardar</button>`)}async function savePay(){let cid=$('pc').value,amt=+$('pa').value||0;if(!cid||amt<=0)return toast('Selecciona clienta y monto');let z=await db.from('payments').insert({client_id:cid,payment_date:$('pd').value,amount:amt,method:$('pm').value,note:$('pn').value});if(z.error)return toast(z.error.message);let c=D.c.find(x=>x.id===cid);if(c)await db.from('clients').update({balance:Math.max(0,+c.balance-amt)}).eq('id',cid);closeM();await load()}
function invForm(id=''){let x=D.i.find(z=>z.id===id)||{};modal(id?'Editar producto':'Nuevo producto',`<label>Nombre</label><input id=ii class=field value="${esc(x.name)}"><label>Categoría</label><input id=ic class=field value="${esc(x.category)}"><div class=grid><div><label>Cantidad</label><input id=iq class=field type=number value="${x.quantity||0}"></div><div><label>Mínimo</label><input id=im class=field type=number value="${x.minimum_quantity||0}"></div></div><label>Costo</label><input id=ix class=field type=number step=.01 value="${x.cost||0}"><button class="primary wide" onclick="saveInv('${id}')">Guardar</button>`)}async function saveInv(id){let r={name:$('ii').value.trim(),category:$('ic').value.trim(),quantity:+$('iq').value||0,minimum_quantity:+$('im').value||0,cost:+$('ix').value||0};let z=id?await db.from('inventory').update(r).eq('id',id):await db.from('inventory').insert(r);if(z.error)return toast(z.error.message);closeM();await load()}
function tirzeForm(){modal('Nuevo registro de Tirze',`<label>Clienta</label><select id=tc class=field>${opts()}</select><label>Notas</label><textarea id=tn class=field rows=6 placeholder="Dosis, fecha, observaciones, seguimiento..."></textarea><button class="primary wide" onclick="saveT()">Guardar</button>`)}async function saveT(){let z=await db.from('tirze_records').insert({client_id:$('tc').value,notes:$('tn').value});if(z.error)return toast(z.error.message);closeM();await load()}
async function del(table,id){if(!confirm('¿Eliminar este registro?'))return;let z=await db.from(table).delete().eq('id',id);if(z.error)return toast(z.error.message);await load()}
$('search').oninput=render;
const loginBtn=$('loginBtn');
if(!db){loginBtn.disabled=true;toast('No se pudo cargar la conexión. Cierra esta pestaña y vuelve a abrir la página.');}
loginBtn.onclick=async()=>{
  if(!db)return toast('La conexión de Supabase no cargó.');
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password)return toast('Escribe tu correo y contraseña.');
  loginBtn.disabled=true;loginBtn.textContent='Entrando…';toast('Conectando…');
  try{const z=await db.auth.signInWithPassword({email,password});if(z.error)toast(z.error.message);}
  catch(e){toast(e?.message||'No se pudo iniciar sesión.');}
  finally{loginBtn.disabled=false;loginBtn.textContent='Entrar';}
};
$('logout').onclick=()=>db&&db.auth.signOut();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(b.dataset.v).classList.remove('hidden')});
if(db){db.auth.onAuthStateChange(async(e,s)=>{if(s){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=s.user.email||'';await load()}else{$('app').classList.add('hidden');$('login').classList.remove('hidden')}});}

</script></body></html>
